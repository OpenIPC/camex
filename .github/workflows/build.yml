#
# build.yml — CI/CD for camex: build, test, release
#

name: camex CI

on:
  push:
    branches: [master, main, develop]
    tags: ['v*']
  pull_request:
    branches: [master, main]
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., v2.3.7)'
        required: true
        default: 'v2.3.7'

env:
  BUILD_DIR: build
  TARGET: camex
  # actions target Node 24 natively (checkout@v5, upload-artifact@v5, download-artifact@v5, gh-release@v3)

jobs:
  # ------------------------------------------------------------------ linux
  linux:
    name: Linux ${{ matrix.platform.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: x86_64
            triple: x86_64-linux-gnu
            arch: amd64
            pkgs: gcc
            strip_args: --strip-unneeded
          - name: arm
            triple: arm-linux-gnueabi
            arch: armhf
            pkgs: gcc-arm-linux-gnueabi
            strip_args: --strip-unneeded
          - name: aarch64
            triple: aarch64-linux-gnu
            arch: arm64
            pkgs: gcc-aarch64-linux-gnu
            strip_args: --strip-unneeded
          - name: mipsel
            triple: mipsel-linux-gnu
            arch: mipsel
            pkgs: gcc-mipsel-linux-gnu
            strip_args: --strip-unneeded

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install cross-compiler
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ${{ matrix.platform.pkgs }} upx-ucl upx 2>/dev/null || true

      - name: Build native (x86_64)
        run: |
          make clean
          make -j$(nproc)
          mkdir -p "${{ env.BUILD_DIR }}"
          cp "${{ env.TARGET }}" "${{ env.BUILD_DIR }}/${{ env.TARGET }}-x86_64"
          "${{ env.BUILD_DIR }}/${{ env.TARGET }}-x86_64" --help 2>&1 | head -5 || true
        if: matrix.platform.name == 'x86_64'

      - name: Build cross
        run: |
          make clean
          make -j$(nproc) \
            CROSS_COMPILE=${{ matrix.platform.triple }}-
          mkdir -p "${{ env.BUILD_DIR }}"
          cp "${{ env.TARGET }}" "${{ env.BUILD_DIR }}/${{ env.TARGET }}-${{ matrix.platform.name }}"
        if: matrix.platform.name != 'x86_64'

      - name: Strip
        run: |
          ${{ matrix.platform.triple }}-strip ${{ matrix.platform.strip_args }} \
            "${{ env.BUILD_DIR }}/${{ env.TARGET }}-${{ matrix.platform.name }}" || true

      - name: Compress with UPX
        run: |
          upx --best --no-color \
            "${{ env.BUILD_DIR }}/${{ env.TARGET }}-${{ matrix.platform.name }}" \
            2>/dev/null || echo "UPX skipped (not available or cannot compress)"

      - name: Report size
        run: |
          echo "## ${{ matrix.platform.name }} binary sizes" | tee -a sizes.md
          ls -lh "${{ env.BUILD_DIR }}/${{ env.TARGET }}-${{ matrix.platform.name }}" | \
            awk '{print "- `" $5 "`  " $9}' | tee -a sizes.md

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: camex-${{ matrix.platform.name }}
          path: ${{ env.BUILD_DIR }}/${{ env.TARGET }}-${{ matrix.platform.name }}
          if-no-files-found: error

      - name: Upload size report
        uses: actions/upload-artifact@v7
        with:
          name: sizes-${{ matrix.platform.name }}
          path: sizes.md
          if-no-files-found: ignore

  # ----------------------------------------------------------- android (APK)
  android:
    name: Android (aarch64 APK)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install NDK
        run: |
          NDK_VER=r27c
          cd /tmp
          curl -fsSOL "https://dl.google.com/android/repository/android-ndk-${NDK_VER}-linux.zip"
          unzip -q android-ndk-${NDK_VER}-linux.zip
          echo "NDK_PATH=/tmp/android-ndk-${NDK_VER}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=/tmp/android-ndk-${NDK_VER}" >> "$GITHUB_ENV"

      - name: Install Android SDK
        run: |
          # Use the pre-installed ANDROID_HOME on ubuntu-latest runner.
          ANDROID_HOME=/usr/local/lib/android/sdk
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          # Set ANDROID_SDK_ROOT to same path to avoid Gradle 8.5 conflict
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          # Ensure needed platform and build-tools are present
          SDKMANAGER=$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager
          if [ -x "$SDKMANAGER" ]; then
            yes | $SDKMANAGER --sdk_root=$ANDROID_HOME \
              "platforms;android-34" "build-tools;34.0.0" \
              2>&1 | tail -5
          else
            echo "Warning: sdkmanager not found at $SDKMANAGER"
          fi

      - name: Set up Gradle
        run: |
          GRADLE_VERSION=8.5
          GRADLE_DIR=/opt/gradle-${GRADLE_VERSION}
          if [ ! -d "$GRADLE_DIR" ]; then
            curl -fsSL "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" \
              -o /tmp/gradle.zip
            sudo unzip -q /tmp/gradle.zip -d /opt/
            rm /tmp/gradle.zip
          fi
          echo "GRADLE_HOME=$GRADLE_DIR" >> "$GITHUB_ENV"
          echo "$GRADLE_DIR/bin" >> "$GITHUB_PATH"

      - name: Decode release keystore
        env:
          KS_B64: ${{ secrets.CAMEX_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/camex-release.jks"
            echo "CAMEX_KEYSTORE_FILE=$RUNNER_TEMP/camex-release.jks" >> "$GITHUB_ENV"
          fi

      - name: Build APK
        env:
          CAMEX_KEYSTORE_PASSWORD: ${{ secrets.CAMEX_KEYSTORE_PASSWORD }}
          CAMEX_KEY_ALIAS: ${{ secrets.CAMEX_KEY_ALIAS }}
          CAMEX_KEY_PASSWORD: ${{ secrets.CAMEX_KEY_PASSWORD }}
        run: |
          cd android
          gradle assembleRelease
          OUT=app/build/outputs/apk/release
          ls -lh "$OUT/"
          # Output is app-release.apk when signed, app-release-unsigned.apk otherwise.
          APK=$(ls "$OUT"/app-release.apk "$OUT"/app-release-unsigned.apk 2>/dev/null | head -1)
          cp "$APK" "$OUT/camex-android.apk"

      - name: Upload artifact (APK)
        uses: actions/upload-artifact@v7
        with:
          name: camex-aarch64-apk
          path: android/app/build/outputs/apk/release/camex-android.apk
          if-no-files-found: error

  # ---------------------------------------------------------------- windows
  windows:
    name: Windows / ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, i686]
        include:
          - arch: x86_64
            cc: x86_64-w64-mingw32-gcc
            strip: x86_64-w64-mingw32-strip
            mingw-pkg: gcc-mingw-w64-x86-64
            pe-type: PE32+
            wintun-arch: amd64
          - arch: i686
            cc: i686-w64-mingw32-gcc
            strip: i686-w64-mingw32-strip
            mingw-pkg: gcc-mingw-w64-i686
            pe-type: PE32
            wintun-arch: x86
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install MinGW
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ${{ matrix.mingw-pkg }}

      - name: Build (${{ matrix.cc }})
        run: |
          rm -rf build
          make clean CC=${{ matrix.cc }} STRIP=${{ matrix.strip }} TARGET=camex.exe
          make -j$(nproc) \
            CC=${{ matrix.cc }} \
            STRIP=${{ matrix.strip }} \
            TARGET=camex.exe
          # Rename so artifacts don't collide when merged
          mv camex.exe camex-${{ matrix.arch }}.exe
          echo "=== Verifying PE format ==="
          file camex-${{ matrix.arch }}.exe
          file camex-${{ matrix.arch }}.exe | grep -q "${{ matrix.pe-type }}" || {
            echo "ERROR: camex-${{ matrix.arch }}.exe is not a valid ${{ matrix.pe-type }} executable"
            exit 1
          }
          echo "PE verification OK"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: camex-${{ matrix.arch }}-mingw
          path: camex-${{ matrix.arch }}.exe
          if-no-files-found: error

  # ---------------------------------------------------------- wine smoke
  wine-smoke:
    name: Wine smoke / ${{ matrix.arch }}
    needs: [windows]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, i686]
        include:
          - arch: x86_64
            winearch: win64
          - arch: i686
            winearch: win32
    steps:
      - name: Download camex-${{ matrix.arch }}.exe
        uses: actions/download-artifact@v7
        with:
          name: camex-${{ matrix.arch }}-mingw
          path: .

      - name: Verify downloaded binary
        run: |
          echo "=== Verifying downloaded artifact ==="
          ls -la camex-${{ matrix.arch }}.exe
          file camex-${{ matrix.arch }}.exe
          file camex-${{ matrix.arch }}.exe | grep -q "PE32" || {
            echo "ERROR: downloaded artifact is not a valid Windows PE"
            exit 1
          }

      - name: Install Wine
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends wine wine32 wine64 2>/dev/null || \
            sudo apt-get install -y -qq --no-install-recommends wine wine64 2>/dev/null || \
            sudo apt-get install -y -qq --no-install-recommends wine 2>/dev/null || true

      - name: Smoke test (--help and --version)
        run: |
          export WINEARCH=${{ matrix.winearch }} WINEPREFIX="${RUNNER_TEMP}/.wine-${{ matrix.arch }}"
          # Create a clean prefix for this architecture
          wineboot --init 2>&1 | grep -v "^[0-9a-f]\{4\}:err:" | grep -v '^[0-9a-f]\{4\}:fixme:' || true
          echo "Using Wine: $(wine --version 2>&1 | head -1)  WINEARCH=${WINEARCH}"
          echo "=== camex-${{ matrix.arch }}.exe --version ==="
          wine camex-${{ matrix.arch }}.exe --version 2>&1 | grep -v "^[0-9a-f]\{4\}:err:"
          echo ""
          echo "=== camex-${{ matrix.arch }}.exe --help ==="
          wine camex-${{ matrix.arch }}.exe --help 2>&1 | head -20
          echo ""
          echo "✅ Wine smoke test completed"

  # ------------------------------------------------------------- macos (utun)
  macos:
    name: macOS (clang + utun)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Build
        run: |
          make clean
          make -j$(sysctl -n hw.logicalcpu) \
            CC=clang STD=gnu99 POSIX_SRC= 2>&1
          mkdir -p build
          cp camex build/camex-darwin
          strip --strip-unneeded build/camex-darwin 2>/dev/null || true

      - name: Smoke test (--help and --version)
        run: |
          if [ -x build/camex-darwin ]; then
            build/camex-darwin --help 2>&1 | head -5
            build/camex-darwin --version 2>&1
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: camex-darwin
          path: build/camex-darwin
          if-no-files-found: ignore

  # ------------------------------------------------------------- smoke test
  smoke:
    name: Smoke test (Docker)
    needs: [linux]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download x86_64 binary
        uses: actions/download-artifact@v7
        with:
          name: camex-x86_64
          path: docker/

      - name: Make binary executable
        run: chmod +x docker/camex-x86_64

      - name: Run smoke test
        env:
          CAMEX_BINARY: docker/camex-x86_64
        run: |
          docker/test-smoke.sh

  # ------------------------------------------------------------- consolidated
  sizes:
    name: Collect sizes
    needs: [linux, smoke, android, windows, wine-smoke, macos]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate size table
        run: |
          echo "## camex binary sizes (UPX compressed)" > sizes-table.md
          echo "" >> sizes-table.md
          echo "| Platform | Size |" >> sizes-table.md
          echo "|----------|------|" >> sizes-table.md
          find artifacts -type f \( -name 'camex-*' -o -name 'camex.exe' -o -name '*.apk' \) | sort | while read f; do
            sz=$(ls -lh "$f" | awk '{print $5}')
            name=$(basename "$f" | sed 's/camex-//; s/\.exe//')
            echo "| $name | $sz |" >> sizes-table.md
          done
          cat sizes-table.md

      - name: Upload size table
        uses: actions/upload-artifact@v7
        with:
          name: sizes-table
          path: sizes-table.md

  # ----------------------------------------------------------------- release
  release:
    name: GitHub Release
    needs: [linux, smoke, android, windows, wine-smoke, macos]
    runs-on: ubuntu-latest
    # Runs on tag push (auto) OR manual workflow_dispatch
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write

    steps:
      - name: Determine tag name
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout (for release notes)
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify version.h matches git tag
        run: |
          FILE_VERSION=$(grep -Po '(?<=CAMEX_VERSION ")[^"]*' src/version.h)
          TAG_VERSION="${{ steps.tag.outputs.tag }}"
          TAG_VERSION="${TAG_VERSION#v}"
          echo "version.h  → ${FILE_VERSION}"
          echo "git tag    → ${TAG_VERSION}"
          if [ "${FILE_VERSION}" != "${TAG_VERSION}" ]; then
            echo "::error::VERSION MISMATCH: version.h says '${FILE_VERSION}' but git tag is 'v${TAG_VERSION}'"
            exit 1
          fi
          echo "✅ Versions match: ${FILE_VERSION}"

      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts
          merge-multiple: true

      - name: Collect release binaries
        run: |
          mkdir release-binaries
          VERSION="${{ steps.tag.outputs.tag }}"
          VERSION="${VERSION#v}"
          [ -z "$VERSION" ] && VERSION="0.0.0"

          # Collect all camex-* (Linux), camex-*.exe (Windows), and .apk (Android)
          find artifacts -type f \( -name 'camex-*' -o -name 'camex.exe' -o -name '*.apk' \) \
            -exec cp -v {} release-binaries/ \;

          # Rename Linux binaries: camex-<arch> → camex-<version>-<arch>
          for f in release-binaries/camex-aarch64 release-binaries/camex-arm \
                   release-binaries/camex-mipsel  release-binaries/camex-x86_64; do
            [ -f "$f" ] || continue
            arch="${f#release-binaries/camex-}"
            mv -v "$f" "release-binaries/camex-${VERSION}-${arch}"
          done

          # Rename APK: camex-android.apk → camex-<version>-android.apk
          if [ -f release-binaries/camex-android.apk ]; then
            mv -v release-binaries/camex-android.apk \
                 "release-binaries/camex-${VERSION}-android.apk"
          fi

          echo "=== Release binaries ==="
          ls -lh release-binaries/

      - name: Package .zip archives for macOS and Windows
        run: |
          VERSION="${{ steps.tag.outputs.tag }}"
          VERSION="${VERSION#v}"
          [ -z "$VERSION" ] && VERSION="0.0.0"
          # macOS .zip
          if [ -f release-binaries/camex-darwin ]; then
            mkdir -p pkg-macos
            cp release-binaries/camex-darwin pkg-macos/camex
            cp LICENSE README.md pkg-macos/ 2>/dev/null || true
            cd pkg-macos && zip -9 "../release-binaries/camex-${VERSION}-macos.zip" * && cd ..
            rm -rf pkg-macos
            # Remove raw darwin binary — only .zip remains
            rm -f release-binaries/camex-darwin
          fi
          # Windows .zip — download wintun.dll once, package per arch
          if ls release-binaries/camex-*.exe >/dev/null 2>&1; then
            # Download wintun.dll once
            curl -fsSL "https://www.wintun.net/builds/wintun-0.14.1.zip" -o /tmp/wintun.zip
            unzip -q -o /tmp/wintun.zip -d /tmp/wintun-extract

            # x86_64 package
            if [ -f release-binaries/camex-x86_64.exe ]; then
              mkdir -p pkg-win64
              cp release-binaries/camex-x86_64.exe pkg-win64/camex.exe
              cp LICENSE README.md pkg-win64/ 2>/dev/null || true
              find /tmp/wintun-extract -name 'wintun.dll' -path '*/amd64/*' -exec cp {} pkg-win64/wintun.dll \;
              cd pkg-win64 && zip -9 "../release-binaries/camex-${VERSION}-windows-x86_64.zip" * && cd ..
              rm -rf pkg-win64
            fi

            # i686 package
            if [ -f release-binaries/camex-i686.exe ]; then
              mkdir -p pkg-win32
              cp release-binaries/camex-i686.exe pkg-win32/camex.exe
              cp LICENSE README.md pkg-win32/ 2>/dev/null || true
              find /tmp/wintun-extract -name 'wintun.dll' -path '*/x86/*' -exec cp {} pkg-win32/wintun.dll \;
              cd pkg-win32 && zip -9 "../release-binaries/camex-${VERSION}-windows-i686.zip" * && cd ..
              rm -rf pkg-win32
            fi

            rm -rf /tmp/wintun.zip /tmp/wintun-extract
            # Remove raw .exe files — only .zip remains
            rm -f release-binaries/camex-x86_64.exe release-binaries/camex-i686.exe
          fi
          echo "=== Release binaries (final) ==="
          ls -lh release-binaries/

      - name: Create or update release (gh CLI)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ steps.tag.outputs.tag }}" --repo "${{ github.repository }}" &>/dev/null; then
            # Release exists — upload/clobber new assets
            gh release upload "${{ steps.tag.outputs.tag }}" \
              --repo "${{ github.repository }}" \
              --clobber \
              release-binaries/*
          else
            # Create new release
            gh release create "${{ steps.tag.outputs.tag }}" \
              --repo "${{ github.repository }}" \
              --title "camex ${{ steps.tag.outputs.tag }}" \
              --generate-notes \
              release-binaries/*
          fi
