#
# build.yml — CI/CD for camex: build, test, release
#
# Release (#60): one release only, "latest", replaced by every push to master
# (or a manual run on master) once all build and test jobs pass. Its title is
# "Camex <CAMEX_VERSION from src/version.h>", its file names carry no version,
# so download links never change. No versioned
# releases or v* tags are kept; the change history lives in CHANGELOG.md.
#

name: camex CI

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main]
  # a manual run on master rebuilds and republishes "latest"
  workflow_dispatch:

# One run per ref at a time. Branches and pull requests: a newer push cancels
# the older run. master (pushes and manual runs share the group): runs are
# queued, never cancelled, so a release is not stopped between deleting and
# recreating "latest"; a newer queued run replaces an older waiting one.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

env:
  BUILD_DIR: build
  TARGET: camex
  # actions target Node 24 natively (checkout@v5, upload-artifact@v5, download-artifact@v5, gh-release@v3)

jobs:
  # The version check of pull requests runs in version.yml: a label change
  # re-runs only that check, not the builds.

  # ------------------------------------------------------------------ linux
  linux:
    name: Linux ${{ matrix.target }} (musl static)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Release binaries are static and linked against musl (#54): OpenIPC firmware
        # has no glibc. Toolchains and checks: ci/build-musl.sh
        target: [x86_64, arm, aarch64, mipsel]
    env:
      TOOLCHAIN_CACHE: ${{ github.workspace }}/.toolchains

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install qemu-user
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-user

      # Native glibc build for the unit and e2e tests on the runner
      - name: Build native (x86_64)
        run: |
          make clean
          make -j$(nproc)
          ./${{ env.TARGET }} --help 2>&1 | head -5 || true
        if: matrix.target == 'x86_64'

      - name: Unit tests
        run: make test
        if: matrix.target == 'x86_64'

      - name: E2E test (TCP pending data, issue #8)
        run: ./docker/test-e2e-tcp-pending.sh
        if: matrix.target == 'x86_64'

      - name: E2E test (client liveness, issue #10)
        run: ./docker/test-e2e-client-liveness.sh
        if: matrix.target == 'x86_64'

      - name: E2E test (key binding and source addresses, issues #5 #6)
        run: ./docker/test-e2e-key-binding.sh
        if: matrix.target == 'x86_64'

      - name: E2E test (REGISTER replay, issue #7)
        run: ./docker/test-e2e-register-replay.sh
        if: matrix.target == 'x86_64'

      - name: E2E test (TCP pre-auth connections, issue #9)
        run: ./docker/test-e2e-tcp-preauth.sh
        if: matrix.target == 'x86_64'

      - name: E2E test (auto pool and unknown clients, issue #15)
        run: ./docker/test-e2e-auto-pool.sh
        if: matrix.target == 'x86_64'

      - name: E2E test (hardening, issue #16)
        run: ./docker/test-e2e-hardening.sh
        if: matrix.target == 'x86_64'

      - name: E2E test (rekeying under traffic, issue #17)
        run: ./docker/test-e2e-rekey.sh
        if: matrix.target == 'x86_64'

      - name: E2E test (changed profile applied live, issue #49)
        run: ./docker/test-e2e-reconfig.sh
        if: matrix.target == 'x86_64'

      - name: E2E test (malformed CONFIG from a fake server, issue #12)
        run: ./docker/test-e2e-bad-config.sh
        if: matrix.target == 'x86_64'

      - name: E2E test (fair handshake budgets under a flood, issue #78)
        run: ./docker/test-e2e-fair-budget.sh
        if: matrix.target == 'x86_64'

      - name: E2E test (no address for two clients, issue #81)
        run: ./docker/test-e2e-multi-client.sh
        if: matrix.target == 'x86_64'

      - name: E2E test (camex --status, issue #82)
        run: ./docker/test-e2e-status.sh
        if: matrix.target == 'x86_64'

      - name: E2E test (client isolation, issue #83)
        run: ./docker/test-e2e-isolation.sh
        if: matrix.target == 'x86_64'

      - name: E2E test (nginx map of the clients, issue #84)
        run: ./docker/test-e2e-nginx-map.sh
        if: matrix.target == 'x86_64'

      - name: Cache toolchain
        uses: actions/cache@v6
        with:
          path: .toolchains
          key: toolchain-${{ matrix.target }}-${{ hashFiles('ci/build-musl.sh') }}

      - name: Build static (musl) and run the unit tests under qemu
        env:
          GITHUB_TOKEN: ${{ github.token }}   # toolchain digest lookup (ci/build-musl.sh)
        run: QEMU=1 ci/build-musl.sh ${{ matrix.target }} "${{ env.BUILD_DIR }}"

      - name: Report size
        run: |
          echo "## ${{ matrix.target }} binary sizes" | tee -a sizes.md
          ls -lh "${{ env.BUILD_DIR }}/${{ env.TARGET }}-${{ matrix.target }}" | \
            awk '{print "- `" $5 "`  " $9}' | tee -a sizes.md

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: camex-${{ matrix.target }}
          path: ${{ env.BUILD_DIR }}/${{ env.TARGET }}-${{ matrix.target }}
          if-no-files-found: error

      - name: Upload size report
        uses: actions/upload-artifact@v7
        with:
          name: sizes-${{ matrix.target }}
          path: sizes.md
          if-no-files-found: ignore

  # ----------------------------------------------------------- android (APK)
  android:
    name: Android (arm64 + armv7 APK)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install NDK
        run: |
          NDK_VER=r27c
          cd /tmp
          curl -fsSOL "https://dl.google.com/android/repository/android-ndk-${NDK_VER}-linux.zip"
          unzip -q android-ndk-${NDK_VER}-linux.zip
          echo "NDK_PATH=/tmp/android-ndk-${NDK_VER}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=/tmp/android-ndk-${NDK_VER}" >> "$GITHUB_ENV"

      - name: Install Android SDK
        run: |
          # Use the pre-installed ANDROID_HOME on ubuntu-latest runner.
          ANDROID_HOME=/usr/local/lib/android/sdk
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          # Set ANDROID_SDK_ROOT to same path to avoid Gradle 8.5 conflict
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          # Ensure needed platform and build-tools are present
          SDKMANAGER=$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager
          if [ -x "$SDKMANAGER" ]; then
            yes | $SDKMANAGER --sdk_root=$ANDROID_HOME \
              "platforms;android-34" "build-tools;34.0.0" \
              2>&1 | tail -5
          else
            echo "Warning: sdkmanager not found at $SDKMANAGER"
          fi

      - name: Set up Gradle
        run: |
          GRADLE_VERSION=8.5
          GRADLE_DIR=/opt/gradle-${GRADLE_VERSION}
          if [ ! -d "$GRADLE_DIR" ]; then
            curl -fsSL "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" \
              -o /tmp/gradle.zip
            sudo unzip -q /tmp/gradle.zip -d /opt/
            rm /tmp/gradle.zip
          fi
          echo "GRADLE_HOME=$GRADLE_DIR" >> "$GITHUB_ENV"
          echo "$GRADLE_DIR/bin" >> "$GITHUB_PATH"

      - name: Decode release keystore
        env:
          KS_B64: ${{ secrets.CAMEX_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/camex-release.jks"
            echo "CAMEX_KEYSTORE_FILE=$RUNNER_TEMP/camex-release.jks" >> "$GITHUB_ENV"
          fi

      - name: Build APK
        env:
          CAMEX_KEYSTORE_PASSWORD: ${{ secrets.CAMEX_KEYSTORE_PASSWORD }}
          CAMEX_KEY_ALIAS: ${{ secrets.CAMEX_KEY_ALIAS }}
          CAMEX_KEY_PASSWORD: ${{ secrets.CAMEX_KEY_PASSWORD }}
        run: |
          cd android
          gradle assembleRelease
          OUT=app/build/outputs/apk/release
          ls -lh "$OUT/"
          # Output is app-release.apk when signed, app-release-unsigned.apk otherwise.
          APK=$(ls "$OUT"/app-release.apk "$OUT"/app-release-unsigned.apk 2>/dev/null | head -1)
          cp "$APK" "$OUT/camex-android.apk"

      - name: Upload artifact (APK)
        uses: actions/upload-artifact@v7
        with:
          name: camex-aarch64-apk
          path: android/app/build/outputs/apk/release/camex-android.apk
          if-no-files-found: error

      # Debuggable build for testing on devices (adb install, run-as, logcat).
      # The release job takes camex-android.apk by name, so it never ends up there.
      - name: Build debug APK
        run: |
          cd android
          gradle assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/camex-android-debug.apk

      - name: Upload artifact (debug APK)
        uses: actions/upload-artifact@v7
        with:
          name: camex-android-debug-apk
          path: android/app/build/outputs/apk/debug/camex-android-debug.apk
          if-no-files-found: error

  # ---------------------------------------------------------------- windows
  windows:
    name: Windows / ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, i686]
        include:
          - arch: x86_64
            cc: x86_64-w64-mingw32-gcc
            strip: x86_64-w64-mingw32-strip
            mingw-pkg: gcc-mingw-w64-x86-64
            pe-type: PE32+
            wintun-arch: amd64
          - arch: i686
            cc: i686-w64-mingw32-gcc
            strip: i686-w64-mingw32-strip
            mingw-pkg: gcc-mingw-w64-i686
            pe-type: PE32
            wintun-arch: x86
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install MinGW
        # apt sometimes hangs on the runner (#93): fail instead of waiting.
        # Takes ~20 s; the limit leaves room for every try below: 2 commands
        # x (3 tries x 180 s + 2 recoveries x (60 s + 10 s)) = 23 min
        timeout-minutes: 25
        run: |
          # Each apt command is cut off after 3 minutes and tried 3 times; an
          # interrupted try leaves dpkg half done, so it is finished first
          # (itself cut off after a minute).
          # man-db's trigger alone can take minutes: skipped.
          sudo rm -f /var/lib/man-db/auto-update
          apt_try() {
            for try in 1 2 3; do
              sudo timeout 180 apt-get -o DPkg::Lock::Timeout=60 \
                -o Acquire::Retries=3 -o Acquire::http::Timeout=30 "$@" && return 0
              echo "apt-get $1: failed or timed out (try $try of 3)"
              [ "$try" -lt 3 ] || break
              sudo timeout 60 dpkg --configure -a || true
              sleep 10
            done
            return 1
          }
          apt_try update -qq
          apt_try install -y -qq ${{ matrix.mingw-pkg }}

      - name: Build (${{ matrix.cc }})
        run: |
          rm -rf build
          make clean CC=${{ matrix.cc }} STRIP=${{ matrix.strip }} TARGET=camex.exe
          make -j$(nproc) \
            CC=${{ matrix.cc }} \
            STRIP=${{ matrix.strip }} \
            TARGET=camex.exe
          # Rename so artifacts don't collide when merged
          mv camex.exe camex-${{ matrix.arch }}.exe
          echo "=== Verifying PE format ==="
          file camex-${{ matrix.arch }}.exe
          file camex-${{ matrix.arch }}.exe | grep -q "${{ matrix.pe-type }}" || {
            echo "ERROR: camex-${{ matrix.arch }}.exe is not a valid ${{ matrix.pe-type }} executable"
            exit 1
          }
          echo "PE verification OK"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: camex-${{ matrix.arch }}-mingw
          path: camex-${{ matrix.arch }}.exe
          if-no-files-found: error

  # ---------------------------------------------------------- wine smoke
  wine-smoke:
    name: Wine smoke / ${{ matrix.arch }}
    needs: [windows]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, i686]
        include:
          - arch: x86_64
            winearch: win64
          - arch: i686
            winearch: win32
    steps:
      - name: Download camex-${{ matrix.arch }}.exe
        uses: actions/download-artifact@v7
        with:
          name: camex-${{ matrix.arch }}-mingw
          path: .

      - name: Verify downloaded binary
        run: |
          echo "=== Verifying downloaded artifact ==="
          ls -la camex-${{ matrix.arch }}.exe
          file camex-${{ matrix.arch }}.exe
          file camex-${{ matrix.arch }}.exe | grep -q "PE32" || {
            echo "ERROR: downloaded artifact is not a valid Windows PE"
            exit 1
          }

      - name: Install Wine
        # apt sometimes hangs on the runner (#93): fail instead of waiting.
        # Takes ~1 min; the limit covers update and the first package set
        # with every try (23 min), a later set fails fast when it is missing
        timeout-minutes: 30
        run: |
          # As in Install MinGW: each apt command cut off after 3 minutes and
          # tried 3 times, man-db's trigger skipped
          sudo rm -f /var/lib/man-db/auto-update
          apt_try() {
            for try in 1 2 3; do
              sudo timeout 180 apt-get -o DPkg::Lock::Timeout=60 \
                -o Acquire::Retries=3 -o Acquire::http::Timeout=30 "$@" && return 0
              echo "apt-get $1: failed or timed out (try $try of 3)"
              [ "$try" -lt 3 ] || break
              sudo timeout 60 dpkg --configure -a || true
              sleep 10
            done
            return 1
          }
          sudo dpkg --add-architecture i386
          apt_try update -qq
          # The package set differs between Ubuntu releases: the first one
          # that installs; none at all fails the step
          for pkgs in "wine wine32 wine64" "wine wine64" "wine"; do
            # shellcheck disable=SC2086
            apt_try install -y -qq --no-install-recommends $pkgs 2>/dev/null && break
          done

      - name: Smoke test (--help and --version)
        run: |
          export WINEARCH=${{ matrix.winearch }} WINEPREFIX="${RUNNER_TEMP}/.wine-${{ matrix.arch }}"
          # Create a clean prefix for this architecture
          wineboot --init 2>&1 | grep -v "^[0-9a-f]\{4\}:err:" | grep -v '^[0-9a-f]\{4\}:fixme:' || true
          echo "Using Wine: $(wine --version 2>&1 | head -1)  WINEARCH=${WINEARCH}"
          echo "=== camex-${{ matrix.arch }}.exe --version ==="
          wine camex-${{ matrix.arch }}.exe --version 2>&1 | grep -v "^[0-9a-f]\{4\}:err:"
          echo ""
          echo "=== camex-${{ matrix.arch }}.exe --help ==="
          wine camex-${{ matrix.arch }}.exe --help 2>&1 | head -20
          echo ""
          echo "✅ Wine smoke test completed"

  # ------------------------------------------------------------- macos (utun)
  macos:
    name: macOS (clang + utun)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Build
        run: |
          make clean
          make -j$(sysctl -n hw.logicalcpu) \
            CC=clang STD=gnu99 POSIX_SRC= 2>&1
          mkdir -p build
          cp camex build/camex-darwin
          strip --strip-unneeded build/camex-darwin 2>/dev/null || true

      - name: Smoke test (--help and --version)
        run: |
          if [ -x build/camex-darwin ]; then
            build/camex-darwin --help 2>&1 | head -5
            build/camex-darwin --version 2>&1
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: camex-darwin
          path: build/camex-darwin
          if-no-files-found: ignore

  # ------------------------------------------------------------- smoke test
  smoke:
    name: Smoke test (Docker)
    needs: [linux]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download x86_64 binary
        uses: actions/download-artifact@v7
        with:
          name: camex-x86_64
          path: docker/

      - name: Make binary executable
        run: chmod +x docker/camex-x86_64

      - name: Run smoke test
        env:
          CAMEX_BINARY: docker/camex-x86_64
        run: |
          docker/test-smoke.sh

      - name: E2E test (Android TUN provider path, issues #18 #19)
        run: docker/test-e2e-tun-provider.sh

  # ------------------------------------------------------------- kernel module
  kmod:
    name: Kernel module / ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 6.8, 6.1 and 4.15 headers: covers both netif_rx() variants
        image: ['ubuntu:24.04', 'debian:bookworm', 'ubuntu:18.04']
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build camex.ko against distro kernel headers
        run: |
          docker run --rm -v "$PWD/src:/src:ro" ${{ matrix.image }} sh -ec '
            export DEBIAN_FRONTEND=noninteractive
            . /etc/os-release
            pkg=linux-headers-generic
            [ "$ID" = debian ] && pkg=linux-headers-amd64
            apt-get update -qq
            apt-get install -y -qq $pkg make gcc >/dev/null
            K=$(ls -d /usr/src/linux-headers-*-generic /usr/src/linux-headers-*-amd64 2>/dev/null | head -1)
            echo "Kernel headers: $K"
            cp -r /src /tmp/m
            make -C "$K" M=/tmp/m modules
            test -f /tmp/m/camex.ko'

  # ------------------------------------------------------------- consolidated
  sizes:
    name: Collect sizes
    needs: [linux, smoke, android, windows, wine-smoke, macos]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate size table
        run: |
          echo "## camex binary sizes" > sizes-table.md
          echo "" >> sizes-table.md
          echo "| Platform | Size |" >> sizes-table.md
          echo "|----------|------|" >> sizes-table.md
          find artifacts -type f \( -name 'camex-*' -o -name 'camex.exe' -o -name '*.apk' \) | sort | while read f; do
            sz=$(ls -lh "$f" | awk '{print $5}')
            name=$(basename "$f" | sed 's/camex-//; s/\.exe//')
            echo "| $name | $sz |" >> sizes-table.md
          done
          cat sizes-table.md

      - name: Upload size table
        uses: actions/upload-artifact@v7
        with:
          name: sizes-table
          path: sizes-table.md

  # ----------------------------------------------------------------- release
  release:
    name: Release "latest"
    needs: [linux, smoke, android, windows, wine-smoke, macos]
    runs-on: ubuntu-latest
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/master'
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts
          merge-multiple: true

      - name: Collect release files
        id: vars
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(sed -n 's/^#define CAMEX_VERSION "\(.*\)"/\1/p' src/version.h)
          [ -n "$VER" ] || { echo "::error::no CAMEX_VERSION in src/version.h"; exit 1; }
          echo "ver=$VER" >> "$GITHUB_OUTPUT"
          # Only the newest commit of master is published: a run of an older one
          # (a manual run started before a push) stops here
          HEAD=$(git ls-remote origin refs/heads/master | cut -f1)
          if [ "$HEAD" != "$GITHUB_SHA" ]; then
            echo "::notice::master is at ${HEAD::7} now, not ${GITHUB_SHA::7}: not published"
            echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # The APK goes to Telegram only when the version changes. A missing
          # release means a first one; any other lookup error stops the job, so
          # an unchanged version is never posted by mistake.
          if PREV=$(gh release view latest --repo "$GITHUB_REPOSITORY" --json name -q .name 2>err.txt); then
            :
          elif grep -q 'release not found' err.txt; then
            PREV=
          else
            echo "::error::cannot read the current latest release: $(cat err.txt)"; exit 1
          fi
          echo "Previous release: ${PREV:-none}"
          [ "$PREV" = "Camex $VER" ] || echo "new=true" >> "$GITHUB_OUTPUT"

          mkdir release
          # Linux: static musl binaries, one per architecture
          for arch in aarch64 arm mipsel x86_64; do
            cp -v "artifacts/camex-$arch" release/
          done
          # Android: the signed release APK only (the debug APK has another name)
          cp -v artifacts/camex-android.apk release/
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1 || true)
          [ -n "$APKSIGNER" ] || { echo "::error::apksigner not found"; exit 1; }
          "$APKSIGNER" verify release/camex-android.apk ||
            { echo "::error::camex-android.apk is not signed: an unsigned APK cannot be installed"; exit 1; }

          # macOS: the binary with LICENSE and README
          mkdir pkg-macos
          cp artifacts/camex-darwin pkg-macos/camex
          cp LICENSE README.md pkg-macos/
          (cd pkg-macos && zip -9 ../release/camex-macos.zip *)
          # Windows: camex.exe with wintun.dll of the same architecture
          curl -fsSL "https://www.wintun.net/builds/wintun-0.14.1.zip" -o wintun.zip
          unzip -q wintun.zip -d wintun
          for pair in x86_64:amd64 i686:x86; do
            arch=${pair%%:*}; wt=${pair#*:}
            mkdir "pkg-$arch"
            cp "artifacts/camex-$arch.exe" "pkg-$arch/camex.exe"
            cp LICENSE README.md "pkg-$arch/"
            cp "wintun/wintun/bin/$wt/wintun.dll" "pkg-$arch/"
            (cd "pkg-$arch" && zip -9 "../release/camex-windows-$arch.zip" *)
          done

          ls -l release

      - name: Publish "latest"
        if: steps.vars.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VER: ${{ steps.vars.outputs.ver }}
        run: |
          gh release delete latest --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes 2>/dev/null || true
          # Downloads are gone until the release is back: retry a failed create
          for try in 1 2 3; do
            if gh release create latest release/* \
              --repo "$GITHUB_REPOSITORY" \
              --latest \
              --title "Camex ${VER}" \
              --target "${GITHUB_SHA}" \
              --notes "Camex ${VER} (${GITHUB_SHA::7}): static musl builds for Linux (aarch64, arm, mipsel, x86_64), the Android app (camex-android.apk), macOS and Windows (x86_64, i686) packages. Rebuilt from every push to master. Changes: CHANGELOG.md; installation: README.md."; then
              exit 0
            fi
            echo "::warning::gh release create failed (attempt $try)"
            # a half-created release blocks the next attempt
            gh release delete latest --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes 2>/dev/null || true
            sleep 15
          done
          echo "::error::latest could not be published"; exit 1

      # The files of every new version go to the Telegram channel, for the
      # archive and test downloads: all the release files in one post
      # (sendMediaGroup, the caption on the last file; sendDocument for a
      # single file), a short caption, no text from CHANGELOG.md (#70).
      # Organization secrets; a failed upload is a warning, not a failed release.
      - name: Telegram
        if: steps.vars.outputs.skip != 'true' && steps.vars.outputs.new == 'true'
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_TOKEN_BOT_OPENIPC }}
          TG_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL_OPENIPC_DEV }}
          VER: ${{ steps.vars.outputs.ver }}
        run: |
          if [ -z "$TG_TOKEN" ] || [ -z "$TG_CHANNEL" ]; then
            echo "::warning::Telegram secrets are not available, files not posted"; exit 0
          fi
          caption=$(printf 'Camex %s\nCommit: %s\nTime: %s\n\n%s' "$VER" "${GITHUB_SHA::7}" \
            "$(date -u '+%Y-%m-%d %H:%M:%S UTC')" "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/latest")
          files=(release/*)
          if [ "${#files[@]}" -gt 10 ]; then
            echo "::warning::${#files[@]} release files, a Telegram post takes at most 10: not posted"; exit 0
          fi
          if [ "${#files[@]}" -eq 1 ]; then
            HTTP=$(curl -sS -o tg.json -w '%{http_code}' "https://api.telegram.org/bot${TG_TOKEN}/sendDocument" \
              -F chat_id="$TG_CHANNEL" -F caption="$caption" -F document=@"${files[0]}") || HTTP=000
          else
            media='[]' form=()
            for i in "${!files[@]}"; do
              item=$(jq -cn --arg m "attach://f$i" '{type: "document", media: $m}')
              [ "$i" -eq $(( ${#files[@]} - 1 )) ] && item=$(jq -c --arg c "$caption" '. + {caption: $c}' <<< "$item")
              media=$(jq -c --argjson it "$item" '. + [$it]' <<< "$media")
              form+=(-F "f$i=@${files[$i]}")
            done
            HTTP=$(curl -sS -o tg.json -w '%{http_code}' "https://api.telegram.org/bot${TG_TOKEN}/sendMediaGroup" \
              -F chat_id="$TG_CHANNEL" -F media="$media" "${form[@]}") || HTTP=000
          fi
          echo "Telegram response: $HTTP"
          [ "$HTTP" = 200 ] || echo "::warning::Telegram upload failed (HTTP $HTTP): $(cat tg.json 2>/dev/null)"
