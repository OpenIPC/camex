include /etc/nginx/camex-map.conf;

map $http_upgrade $camex_connection {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    # listen 443 ssl;
    # ssl_certificate     /etc/ssl/openipc.click/fullchain.pem;
    # ssl_certificate_key /etc/ssl/openipc.click/privkey.pem;
    server_name *.openipc.click;

    location / {
        if ($camex_upstream = "") {
            return 503;
        }
        proxy_pass http://$camex_upstream;
        proxy_http_version 1.1;
        # WebSocket (live view in some web UIs)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $camex_connection;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # A camera behind a slow link: fail fast, stream without buffering
        proxy_connect_timeout 5s;
        proxy_read_timeout 300s;
        proxy_buffering off;
        proxy_request_buffering off;
        # Uploads of any size go through to the device: a camera's firmware
        # update, a flash image written through microsnander's page (nginx
        # stops at 1 MB by default: 413)
        client_max_body_size 0;
        error_page 502 503 504 = @offline;
    }

    location @offline {
        default_type text/html;
        # No $host here: it comes from the request and would go into the page
        # unescaped. "Device", not "camera": decoders, programmers and TV boxes
        # connect too; and a device online whose app has no web page on the port
        # (camex 4.1+ on Android refuses it: 502) lands here as well
        return 503 "<!doctype html><title>Device not reachable</title><h1>Device not reachable</h1><p>No web page answers for this name right now: the device is not connected to the camex server, its app has no web page on this port, or there is no device with this name. The start page shows which devices are online.</p>\n";
    }
}

# The start page
server {
    listen 80;
    # listen 443 ssl;
    # ssl_certificate     /etc/ssl/openipc.click/fullchain.pem;
    # ssl_certificate_key /etc/ssl/openipc.click/privkey.pem;
    server_name openipc.click;

    # allow 192.168.0.0/16;
    # deny all;
    auth_basic "camex";
    auth_basic_user_file /etc/nginx/camex.htpasswd;

    root /var/lib/camex-nginx;

    location = / {
        # The list changes as devices come and go: no stale copy
        add_header Cache-Control "no-cache";
        try_files /index.html =404;
    }

    location / {
        return 404;
    }
}
