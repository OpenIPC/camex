include /etc/nginx/camex-map.conf;

map $http_upgrade $camex_connection {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    # listen 443 ssl;
    # ssl_certificate     /etc/ssl/openipc.click/fullchain.pem;
    # ssl_certificate_key /etc/ssl/openipc.click/privkey.pem;
    server_name *.openipc.click;

    location / {
        if ($camex_upstream = "") {
            return 503;
        }
        proxy_pass http://$camex_upstream;
        proxy_http_version 1.1;
        # WebSocket (live view in some web UIs)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $camex_connection;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # A camera behind a slow link: fail fast, stream without buffering
        proxy_connect_timeout 5s;
        proxy_read_timeout 300s;
        proxy_buffering off;
        proxy_request_buffering off;
        error_page 502 503 504 = @offline;
    }

    location @offline {
        default_type text/html;
        # No $host here: it comes from the request and would go into the page
        # unescaped
        return 503 "<!doctype html><title>Camera offline</title><h1>This camera is offline</h1><p>The camera is not connected to the camex server right now, or there is no camera with this name.</p>\n";
    }
}

# The start page
server {
    listen 80;
    # listen 443 ssl;
    # ssl_certificate     /etc/ssl/openipc.click/fullchain.pem;
    # ssl_certificate_key /etc/ssl/openipc.click/privkey.pem;
    server_name openipc.click;

    # allow 192.168.0.0/16;
    # deny all;
    auth_basic "camex";
    auth_basic_user_file /etc/nginx/camex.htpasswd;

    root /var/lib/camex-nginx;

    location = / {
        # The list changes as devices come and go: no stale copy
        add_header Cache-Control "no-cache";
        try_files /index.html =404;
    }

    location / {
        return 404;
    }
}
