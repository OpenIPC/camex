# Installed as: /etc/nginx/conf.d/camex-nginx.conf
# Docs: https://github.com/OpenIPC/camex/blob/master/docs/nginx.md#nginx
#
# camex itself (web_listen = yes in [server] of camex.conf, #203) tells
# nginx where each name goes and serves the start page: no map file, no
# sync script, no reloads. nginx needs ngx_http_auth_request_module (in
# the nginx packages of Debian and Ubuntu).
#

map $http_upgrade $camex_connection {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    # listen 443 ssl;
    # ssl_certificate     /etc/ssl/openipc.click/fullchain.pem;
    # ssl_certificate_key /etc/ssl/openipc.click/privkey.pem;
    server_name *.openipc.click;

    location / {
        # Which device this name is: camex answers <address>:<port>, or 403
        # when no device has it (the offline page below)
        auth_request /_camex_resolve;
        auth_request_set $camex_upstream $upstream_http_x_camex_upstream;
        proxy_pass http://$camex_upstream;
        proxy_http_version 1.1;
        # WebSocket (live view in some web UIs)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $camex_connection;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # A camera behind a slow link: fail fast, stream without buffering
        proxy_connect_timeout 5s;
        proxy_read_timeout 300s;
        proxy_buffering off;
        proxy_request_buffering off;
        # Uploads of any size go through to the device: a camera's firmware
        # update, a flash image written through microsnander's page (nginx
        # stops at 1 MB by default: 413)
        client_max_body_size 0;
        # 403: no such device; 500: camex did not answer; 502-504: the
        # device did not
        error_page 403 500 502 503 504 = @offline;
    }

    location = /_camex_resolve {
        internal;
        proxy_pass http://127.0.0.1:5801/resolve;
        # A lookup, whatever the request: an upload is a POST, and nginx
        # holds this subrequest to the upload's size too (1 MB by default:
        # 413, and the device seemed offline)
        proxy_method GET;
        client_max_body_size 0;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        # The name nginx was asked for; nothing of the request's own
        proxy_set_header X-Camex-Host $host;
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
    }

    location @offline {
        default_type text/html;
        # No $host here: it comes from the request and would go into the page
        # unescaped. "Device", not "camera": decoders, programmers and TV boxes
        # connect too; and a device online whose app has no web page on the port
        # (camex 4.1+ on Android refuses it: 502) lands here as well
        return 503 "<!doctype html><title>Device not reachable</title><h1>Device not reachable</h1><p>No web page answers for this name right now: the device is not connected to the camex server, its app has no web page on this port, or there is no device with this name. The start page shows which devices are online.</p>\n";
    }
}

# The start page: camex serves it, nginx asks for the password
server {
    listen 80;
    # listen 443 ssl;
    # ssl_certificate     /etc/ssl/openipc.click/fullchain.pem;
    # ssl_certificate_key /etc/ssl/openipc.click/privkey.pem;
    server_name openipc.click;

    # allow 192.168.0.0/16;
    # deny all;
    auth_basic "camex";
    auth_basic_user_file /etc/nginx/camex.htpasswd;

    location / {
        proxy_pass http://127.0.0.1:5801;
        proxy_http_version 1.1;
        # The page's links: nginx's name, port and scheme
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization "";
        proxy_connect_timeout 2s;
        proxy_read_timeout 10s;
    }

    # nginx's own lookup, never from outside
    location = /resolve {
        return 404;
    }
}
