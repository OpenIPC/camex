# nginx-camex.conf — the web UI of every camex client by name (#84)
#
#   http://<client ID>.cam.example.lan/  ->  http://<its tunnel address>:80/
#
# Put this file in /etc/nginx/conf.d/ (inside nginx's http block). The map
# it includes comes from camex-nginx-sync.sh (camex --status --format
# nginx-map); a name nobody has, or a client that is offline, gets the
# "offline" page. Needs DNS records for *.cam.example.lan and, for the
# start page, cam.example.lan itself (a wildcard does not cover it) -> this
# host. For HTTPS add a certificate for both names, *.cam.example.lan and
# cam.example.lan (see the commented lines).
# Before nginx first starts, create an empty map so that it can:
#   printf 'map $host $camex_upstream {\n}\n' > /etc/nginx/camex-map.conf
# A --default target must be an IPv4 address and port: proxy_pass with a
# variable has no resolver here.
#
# The bare domain (http://cam.example.lan/) serves the start page: every
# connected client with its name and a link, written by the sync script
# with INDEX=/var/lib/camex-nginx/index.html (#105).

include /etc/nginx/camex-map.conf;

map $http_upgrade $camex_connection {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    # listen 443 ssl;
    # ssl_certificate     /etc/ssl/cam.example.lan/fullchain.pem;
    # ssl_certificate_key /etc/ssl/cam.example.lan/privkey.pem;
    server_name *.cam.example.lan;

    location / {
        if ($camex_upstream = "") {
            return 503;
        }
        proxy_pass http://$camex_upstream;
        proxy_http_version 1.1;
        # WebSocket (live view in some web UIs)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $camex_connection;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # A camera behind a slow link: fail fast, stream without buffering
        proxy_connect_timeout 5s;
        proxy_read_timeout 300s;
        proxy_buffering off;
        proxy_request_buffering off;
        error_page 502 503 504 = @offline;
    }

    location @offline {
        default_type text/html;
        # No $host here: it comes from the request and would go into the page
        # unescaped
        return 503 "<!doctype html><title>Camera offline</title><h1>This camera is offline</h1><p>The camera is not connected to the camex server right now, or there is no camera with this name.</p>\n";
    }
}

# The start page. It lists every connected device: let in only those who
# may open the cameras, e.g. with allow/deny or auth_basic below
server {
    listen 80;
    # listen 443 ssl;
    # ssl_certificate     /etc/ssl/cam.example.lan/fullchain.pem;
    # ssl_certificate_key /etc/ssl/cam.example.lan/privkey.pem;
    server_name cam.example.lan;

    # allow 192.168.0.0/16;
    # deny all;
    # auth_basic "camex";
    # auth_basic_user_file /etc/nginx/camex.htpasswd;

    root /var/lib/camex-nginx;

    location = / {
        # The list changes as devices come and go: no stale copy
        add_header Cache-Control "no-cache";
        try_files /index.html =404;
    }

    location / {
        return 404;
    }
}
