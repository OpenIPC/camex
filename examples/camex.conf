#
# camex.conf — example server-side parameter database
#
# [server]     — server runtime parameters (override CLI defaults).
#                CLI arguments always take priority over these values.
# [defaults]   — default profile applied to every client unless overridden.
# [client ID]  — per-client profile; ID = MAC address or any unique string.
#
# Per-client sections override [defaults].
# Protocol v2 (camex 3.x) is always encrypted. The server needs its key pair
# (server_key=, created with "camex --genkey"); clients need its public key
# (--server-pubkey) and a pre-shared key.
# The optional "psk" field sets a per-client pre-shared key: hex:<64 hex
# digits>, base64:<44 characters>, or a passphrase (stretched with Argon2id).
# Clients without a "psk" entry authenticate using the global psk.
# Having both a global PSK and per-client PSKs is supported simultaneously.
#

[server]
# port=5800
# bind_ip=0.0.0.0
# local_cidr=10.0.0.1/24
# mtu=1500
# server_key=<base64 private key from camex --genkey>  (or --server-key-file)
# psk=global-server-passphrase
# tun_dev=camex0
# bind_dev=eth0
# pid_file=/var/run/camex.pid
# Auto-mode clients whose ID has no [client ID] section below get
# [defaults] or an address from the auto pool. Set to "no" to reject them.
# allow_unknown_clients=yes

[defaults]
# WARNING: every client must have a unique local_cidr — override it in [client] sections.
# Values here apply to any client that does not have its own explicit profile.
local_cidr=10.0.0.100/24
gateway_ip=10.0.0.1
mtu=1500
route_cidr=192.168.100.0/24
route_cidr=192.168.101.0/24

[client 0203A104B5AE]
local_cidr=10.0.0.2/24
gateway_ip=10.0.0.1
route_cidr=192.168.200.0/24
# psk=per-client-secret-for-this-device

[client ABCDEF123456]
local_cidr=10.0.0.3/24
gateway_ip=10.0.0.1
psk=unique-passphrase-for-ABCDEF123456
