# camex.conf — example server-side parameter database
#
# [server]     — server runtime parameters (override CLI defaults).
#                CLI arguments always take priority over these values.
# [defaults]   — default profile applied to every client unless overridden.
# [client ID]  — per-client profile; ID = MAC address or any unique string.
#
# Per-client sections override [defaults].
# Protocol v2 (camex 3.x) is always encrypted. The server needs its key pair
# (server_key=, created with "camex --genkey"); clients need its public key
# (--server-pubkey) and a pre-shared key.
# The optional "psk" field sets a per-client pre-shared key: hex:<64 hex
# digits>, base64:<44 characters>, or a passphrase (stretched with Argon2id).
# Clients without a "psk" entry authenticate using the global psk.
# Having both a global PSK and per-client PSKs is supported simultaneously.
# The optional "name" field (only in [client ID]) is the client's display
# name on the start page (camex --status --format nginx-index, #105) and in
# camex --status: UTF-8 text, up to 64 bytes. Without it the ID is shown.
# A [client ID] block lists its ID in the file, even with only "name":
# with allow_unknown_clients=no that client is let in.
#

[server]
# port=5800
# bind_ip=0.0.0.0
# local_cidr=10.0.0.1/24
# mtu=1500
# server_key=<base64 private key from camex --genkey>  (or --server-key-file)
# psk=global-server-passphrase
# tun_dev=camex0
# bind_dev=eth0
# pid_file=/var/run/camex.pid
# Control socket for camex --status (#82); default
# /run/camex/camex-<udp|tcp>-<port>.sock, "none" turns it off
# control_socket=/run/camex/camex.sock
# The domain of the nginx map and start page (#106): the cameras open at
# <ID>.<domain>; camex --status --format nginx-map / nginx-index and
# camex-nginx-sync.sh take it from here (--domain or DOMAIN= override it)
# domain=openipc.click
# Drop packets from one client to another (#83): they never reach the
# tunnel interface, so a firewall there cannot stop them. Default: no
# client_isolation=yes
# Auto-mode clients whose ID has no [client ID] section below get
# [defaults] or an address from the auto pool. Set to "no" to reject them.
# allow_unknown_clients=yes
# Auto pool (network/prefix, /8 to /30). The first address is the gateway
# the clients get: give it to the server as local_cidr above (for this pool
# 10.200.0.1/24). Clients get the second to the last but one address, with
# the pool's prefix. A reload (kill -HUP) applies a new pool: auto-mode
# clients move to it with their next handshake.
# auto_pool=10.200.0.0/24
# Client slots, 1 to 65534, read at startup. Without it: the number of
# pool addresses, at least 256. A slot takes about 1.3 KB; over TCP the
# server keeps at most FD_SETSIZE - 32 (992 on Linux).
# max_clients=256

[defaults]
# WARNING: every client must have a unique local_cidr — override it in [client] sections.
# Values here apply to any client that does not have its own explicit profile.
local_cidr=10.0.0.100/24
gateway_ip=10.0.0.1
mtu=1500
route_cidr=192.168.100.0/24
route_cidr=192.168.101.0/24
# The port of the nginx start page's link to a client's external IP (#119):
# http://<IP>:<port>/, 8080 without it, "none" for the IP without a link.
# A [client ID] block's own peer_port= wins
# peer_port=8080

[client 0203A104B5AE]
name=Warehouse, entrance
local_cidr=10.0.0.2/24
gateway_ip=10.0.0.1
route_cidr=192.168.200.0/24
# This camera's web UI is on port 80 of its external IP (#119)
# peer_port=80
# psk=per-client-secret-for-this-device

[client ABCDEF123456]
local_cidr=10.0.0.3/24
gateway_ip=10.0.0.1
psk=unique-passphrase-for-ABCDEF123456
