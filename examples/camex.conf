# psk=global-server-passphrase
# tun_dev=camex0
# bind_dev=eth0
# pid_file=/var/run/camex.pid
# control_socket=/run/camex/camex.sock
# domain=openipc.click
# client_isolation=yes
# allow_unknown_clients=yes
# auto_pool=10.200.0.0/24
# max_clients=256
